<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlywheelCAD — coming soon</title>
<meta name="description" content="FlywheelCAD: parametric CAD for macOS where every model is a Python file. Coming soon.">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root { --bg: #fbfaf8; --ink: #16181d; --muted: #5d636e; --accent: #1f5f4f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e1013; --ink: #e9eaec; --muted: #9aa1ab; --accent: #5fd6b4; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 40px 20px; background: var(--bg); color: var(--ink);
    font: 16px/1.6 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased; text-align: center;
  }
  main { max-width: 560px; }
  .mark { width: 44px; height: 44px; color: var(--accent); }
  .brand { font-weight: 650; font-size: 18px; letter-spacing: -.01em; margin: 10px 0 40px; }
  h1 { font-size: clamp(36px, 8vw, 54px); line-height: 1.05; letter-spacing: -.03em; font-weight: 660; margin: 0 0 18px; }
  p { margin: 0; color: var(--muted); font-size: clamp(16px, 2.4vw, 18px); }
  .foot { margin-top: 48px; font-size: 13.5px; }
</style>
</head>
<body>
<main>
  <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
    <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.6"/>
    <path d="M12 3.2v6.2M12 14.4v6.4M3.2 12h6.2M14.4 12h6.4"/>
  </svg>
  <div class="brand">FlywheelCAD</div>
  <h1>Coming soon.</h1>
  <p>Parametric CAD for macOS where every model is a Python file.</p>
  <p class="foot">A Digital Handstand app.</p>
</main>
</body>
</html>
